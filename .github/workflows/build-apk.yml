name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodunu Cek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK 36 ve Lisanslari Hazirla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Ortam, Orijinal SHA-1 Keystore, Firebase ve Tam Sistem Dosyalarini Hazirla
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=" > .env
            fi
          fi
          python3 -c "import sys,io,base64,lzma,tarfile; tarfile.open(fileobj=io.BytesIO(lzma.decompress(base64.b64decode(sys.stdin.read()))), mode='r:').extractall('.')" << 'EOF'
