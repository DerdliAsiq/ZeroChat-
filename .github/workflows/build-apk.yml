          list_kt = Path("app/src/main/java/com/example/ui/screens/ChatListAndDiscoveryScreen.kt")
          if main_kt.exists() and list_kt.exists():
              ltxt = list_kt.read_text(encoding="utf-8")
              mtxt = main_kt.read_text(encoding="utf-8")
              if "(UserProfile, String) -> Unit" in ltxt:
