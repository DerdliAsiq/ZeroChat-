      - name: Gradle 9.3.1 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Debug APK Derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "=========================================="
            echo "KOTLIN DERLEME HATASI DETAYI:"
            grep -E "^e: |FAILURE:|What went wrong" -A 4 build.log || tail -n 60 build.log
            echo "=========================================="
            exit 1
          }

      - name: ZeroChat APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChat-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
