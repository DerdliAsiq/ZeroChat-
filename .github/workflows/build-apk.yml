name: ZeroChat Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodunu Cek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK 36 ve Lisanslari Hazirla
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" "platforms;android-36.1" || true

      - name: Ortam, Keystore, Firebase ve Kod Senkronizasyonu
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          python3 - << 'EOF'
          import os, re, base64
          from pathlib import Path

          # 0) GitHub export sirasinda cikarilan app/google-services.json dosyasini olustur
          gs_path = Path("app/google-services.json")
          if not gs_path.exists():
              gs_b64 = (
                  "ewogICJwcm9qZWN0X2luZm8iOiB7CiAgICAicHJvamVjdF9udW1iZXIiOiAiNDAwMDQ3MzQxMTUxIiwK"
                  "ICAgICJwcm9qZWN0X2lkIjogImdlbi1sYW5nLWNsaWVudC0wMDcwOTgzNTI0IiwKICAgICJzdG9yYWdl"
                  "X2J1Y2tldCI6ICJnZW4tbGFuZy1jbGllbnQtMDA3MDk4MzUyNC5maXJlYmFzZXN0b3JhZ2UuYXBwIgog"
                  "IH0sCiAgImNsaWVudCI6IFsKICAgIHsKICAgICAgImNsaWVudF9pbmZvIjogewogICAgICAgICJtb2Jp"
                  "bGVzZGtfYXBwX2lkIjogIjE6NDAwMDQ3MzQxMTUxOmFuZHJvaWQ6ZTAzNTY3ZTgzMDZiYmE1ZDkxMjVl"
                  "YSIsCiAgICAgICAgImFuZHJvaWRfY2xpZW50X2luZm8iOiB7CiAgICAgICAgICAicGFja2FnZV9uYW1l"
                  "IjogImNvbS5haXN0dWRpby56ZXJvY2hhdC54a3ZxIgogICAgICAgIH0KICAgICAgfSwKICAgICAgIm9h"
                  "dXRoX2NsaWVudCI6IFsKICAgICAgICB7CiAgICAgICAgICAiY2xpZW50X2lkIjogIjQwMDA0NzM0MTE1"
                  "MS10cmlldnFndDdja2sxcTF1ajdibjJtbDg3bGI3Zm82ai5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNv"
                  "bSIsCiAgICAgICAgICAiY2xpZW50X3R5cGUiOiAxLAogICAgICAgICAgImFuZHJvaWRfaW5mbyI6IHsK"
                  "ICAgICAgICAgICAgInBhY2thZ2VfbmFtZSI6ICJjb20uYWlzdHVkaW8uemVyb2NoYXQueGt2cSIsCiAg"
                  "ICAgICAgICAgICJjZXJ0aWZpY2F0ZV9oYXNoIjogImE3MzFjOGI5MWUwMWFlY2U1YjFiNzFkYzU5ODc3"
                  "NjY3NGEzNDk2YTAiCiAgICAgICAgICB9CiAgICAgICAgfSwKICAgICAgICB7CiAgICAgICAgICAiY2xp"
                  "ZW50X2lkIjogIjQwMDA0NzM0MTE1MS1wYTQ3Mm4xYjFpYXVvdHZmMTd2ZG1hNnZlcjUxbWl0Yi5hcHBz"
                  "Lmdvb2dsZXVzZXJjb250ZW50LmNvbSIsCiAgICAgICAgICAiY2xpZW50X3R5cGUiOiAzCiAgICAgICAg"
                  "fQogICAgICBdLAogICAgICAiYXBpX2tleSI6IFsKICAgICAgICB7CiAgICAgICAgICAiY3VycmVudF9r"
                  "ZXkiOiAiQUl6YVN5QTJDclR0SkFZVklTVW1reEIxNDdNOWY5SlFwUHpWakFjIgogICAgICAgIH0KICAg"
                  "ICAgXSwKICAgICAgInNlcnZpY2VzIjogewogICAgICAgICJhcHBpbnZpdGVfc2VydmljZSI6IHsKICAg"
                  "ICAgICAgICJvdGhlcl9wbGF0Zm9ybV9vYXV0aF9jbGllbnQiOiBbCiAgICAgICAgICAgIHsKICAgICAg"
                  "ICAgICAgICAiY2xpZW50X2lkIjogIjQwMDA0NzM0MTE1MS1wYTQ3Mm4xYjFpYXVvdHZmMTd2ZG1hNnZl"
                  "cjUxbWl0Yi5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNvbSIsCiAgICAgICAgICAgICAgImNsaWVudF90"
                  "eXBlIjogMwogICAgICAgICAgICB9CiAgICAgICAgICBdCiAgICAgICAgfQogICAgICB9CiAgICB9CiAg"
                  "XSwKICAiY29uZmlndXJhdGlvbl92ZXJzaW9uIjogIjEiCn0="
              )
              gs_path.write_bytes(base64.b64decode(gs_b64))

          # AuthScreen.kt icindeki R.string.default_web_client_id referansini dogrudan guvenli sabit ile degistir
          auth_kt = Path("app/src/main/java/com/example/ui/auth/AuthScreen.kt")
          if auth_kt.exists():
              atxt = auth_kt.read_text(encoding="utf-8")
              atxt = atxt.replace(
                  "context.getString(R.string.default_web_client_id)",
                  '"400047341151-pa472n1b1iauotvf17vdma6ver51mitb.apps.googleusercontent.com"'
              )
              auth_kt.write_text(atxt, encoding="utf-8")

          fb_cfg = Path("app/src/main/res/values/firebase_applet_config.xml")
          if not fb_cfg.exists():
              fb_cfg.write_text(
                  '<?xml version="1.0" encoding="utf-8" standalone="no"?>\n'
                  '<resources>\n'
                  '    <string name="firestore_database_id" translatable="false">ai-studio-android-zerochat-157b48f2-6079-4afa-9173-4eebd46edd97</string>\n'
                  '</resources>\n',
                  encoding="utf-8"
              )

          # 1) ZeroChatModels.kt icine participantHandles ozelligi ekle (eger yoksa)
          models_kt = Path("app/src/main/java/com/example/data/model/ZeroChatModels.kt")
          if models_kt.exists():
              mtxt = models_kt.read_text(encoding="utf-8")
              if "val participantHandles" not in mtxt:
                  mtxt = mtxt.replace(
                      "val defaultTtlSeconds: Long = 0L,",
                      "val defaultTtlSeconds: Long = 0L,\n    val participantHandles: List<String> = emptyList(),"
                  )
                  models_kt.write_text(mtxt, encoding="utf-8")

          # 2) LocalVaultDatabase.kt icine decryptedPreview extension ekle (eger yoksa)
          vault_kt = Path("app/src/main/java/com/example/data/local/LocalVaultDatabase.kt")
          if vault_kt.exists():
              vtxt = vault_kt.read_text(encoding="utf-8")
              if "decryptedPreview" not in vtxt:
                  vtxt = vtxt + "\nval ScheduledEnvelopeEntity.decryptedPreview: String get() = plaintext\n"
                  vault_kt.write_text(vtxt, encoding="utf-8")

          # 3) Tum Kotlin dosyalarinda sched.decryptedPreview referansini duzelt
          for kt_path in Path("app/src/main/java").rglob("*.kt"):
              txt = kt_path.read_text(encoding="utf-8")
              new_txt = txt.replace("sched.decryptedPreview", "sched.plaintext")
              if new_txt != txt:
                  kt_path.write_text(new_txt, encoding="utf-8")

          # 4) MainActivity.kt icinde onSelectPeerForChat imzasi eski kalmissa duzelt
          main_kt = Path("app/src/main/java/com/example/MainActivity.kt")
          list_kt = Path("app/src/main/java/com/example/ui/screens/ChatListAndDiscoveryScreen.kt")
          if main_kt.exists() and list_kt.exists():
              ltxt = list_kt.read_text(encoding="utf-8")
              mtxt = main_kt.read_text(encoding="utf-8")
              if "(UserProfile, String) -> Unit" in ltxt:
                  mtxt2 = mtxt.replace(
                      "onSelectPeerForChat = viewModel::startDirectChatWithPeer",
                      "onSelectPeerForChat = { peer, note -> viewModel.startDirectChatWithPeer(peer, note) }"
                  )
                  mtxt2 = re.sub(
                      r"onSelectPeerForChat\s*=\s*\{\s*peer\s*->\s*viewModel\.startDirectChatWithPeer\(peer\)\s*\}",
                      "onSelectPeerForChat = { peer, note -> viewModel.startDirectChatWithPeer(peer, note) }",
                      mtxt2
                  )
                  if mtxt2 != mtxt:
                      main_kt.write_text(mtxt2, encoding="utf-8")

          # 5) Eger GitHub runner'da android-36.1 SDK paketi yoksa compileSdk = 36 yap
          sdk_root = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          if not Path(sdk_root, "platforms", "android-36.1").exists():
              gradle_kt = Path("app/build.gradle.kts")
              if gradle_kt.exists():
                  gtxt = gradle_kt.read_text(encoding="utf-8")
                  gtxt = gtxt.replace(
                      "compileSdk { version = release(36) { minorApiLevel = 1 } }",
                      "compileSdk = 36"
                  )
                  gradle_kt.write_text(gtxt, encoding="utf-8")
          EOF

      - name: Gradle 9.3.1 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Debug APK Derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "=========================================="
            echo "KOTLIN DERLEME HATASI DETAYI:"
            grep -E "^e: |FAILURE:|What went wrong" -A 4 build.log || tail -n 60 build.log
            echo "=========================================="
            exit 1
          }

      - name: ZeroChat APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChat-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
