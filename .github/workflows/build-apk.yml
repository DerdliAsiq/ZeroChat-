                      "onSelectPeerForChat = viewModel::startDirectChatWithPeer",
                      "onSelectPeerForChat = { peer, note -> viewModel.startDirectChatWithPeer(peer, note) }"
                  )
                  mtxt2 = re.sub(
                      r"onSelectPeerForChat\s*=\s*\{\s*peer\s*->\s*viewModel\.startDirectChatWithPeer\(peer\)\s*\}",
                      "onSelectPeerForChat = { peer, note -> viewModel.startDirectChatWithPeer(peer, note) }",
                      mtxt2
                  )
                  if mtxt2 != mtxt:
                      main_kt.write_text(mtxt2, encoding="utf-8")
          sdk_root = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          if not Path(sdk_root, "platforms", "android-36.1").exists():
              gradle_kt = Path("app/build.gradle.kts")
              if gradle_kt.exists():
