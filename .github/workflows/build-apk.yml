name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodunu Cek (Checkout)
        uses: actions/checkout@v4

      - name: JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Node 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Android SDK 36 ve Lisanslari Hazirla
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Imzalama anahtari ve Firebase yapilandirmasi depoda tutulmaz; GitHub Secrets'tan yazilir.
      # Gerekli secret'lar: DEBUG_KEYSTORE_B64, GOOGLE_SERVICES_JSON_B64 (dosyalarin base64 hali).
      - name: Keystore ve Firebase Yapilandirmasini Secrets'tan Yaz
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ] || [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 ve GOOGLE_SERVICES_JSON_B64 secret'lari tanimli degil."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          [ -f .env ] || cp .env.example .env

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: Node Bagimliliklari
        run: npm ci

      - name: Debug APK Derle
        run: ./gradlew assembleDebug -x lint --stacktrace --no-daemon

      - name: Testler (Firestore Emulatoru ile)
        run: npm test

      - name: APK Dosyasini Artifacts Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
