          vault_kt = Path("app/src/main/java/com/example/data/local/LocalVaultDatabase.kt")
          if vault_kt.exists():
              vtxt = vault_kt.read_text(encoding="utf-8")
              if "decryptedPreview" not in vtxt:
                  vtxt = vtxt + "\nval ScheduledEnvelopeEntity.decryptedPreview: String get() = plaintext\n"
