name: Android APK Build
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build-apk:
    name: ZeroChat Debug APK Derle
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodunu Cek (Checkout)
        uses: actions/checkout@v4
      - name: JDK 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Android SDK 36 ve Lisanslari Hazirla
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"
